  <header class="header">
    <button class="header-menu" id="sidebar-toggle" type="button" aria-label="Toggle menu"><svg viewBox="0 0 24 24"><use href="#i-menu"/></svg></button>
    <a class="logo" href="#/promotions" aria-label="Replayarr">
      <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg></span>
      <span class="logo-word">Replay<b>arr</b></span>
    </a>
    <label class="header-search">
      <svg viewBox="0 0 24 24"><use href="#i-search"/></svg>
      <input id="global-search" type="search" placeholder="Search" autocomplete="off" aria-label="Search promotions and events">
      <div id="search-results" class="search-results" hidden></div>
    </label>
    <div class="header-actions">
      <a class="header-icon" href="#/system/status" title="System status" aria-label="System status"><svg viewBox="0 0 24 24"><use href="#i-heartbeat"/></svg><span id="health-badge" class="health-badge" hidden></span></a>
    </div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Main navigation"></nav>

  <main class="page" id="page">
    <div class="page-toolbar" id="toolbar"></div>
    <div class="page-content" id="content"></div>
  </main>

  <div id="modal-root"></div>
  <div id="messages" class="messages" role="status" aria-live="polite"></div>
</body>
</html>
